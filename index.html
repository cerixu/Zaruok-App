<!doctype html>
<html lang="pl" data-theme="dark" data-mode="pro">
<head>
  <meta charset="utf-8">
  <title>Żarłok</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Żarłok — prywatny notatnik szefa kuchni: receptury, przeliczanie, procenty piekarskie, food cost, zakupy. Działa offline.">

  <!-- Kolor paska systemowego (jasny / ciemny) -->
  <meta name="theme-color" content="#1d1d1f">
  <meta name="color-scheme" content="dark light">

  <!-- iOS: aplikacja na ekranie początkowym -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Żarłok">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="start-final.css">

  <!-- Motyw ustawiany zanim pojawi się cokolwiek (brak błysku). Źródłem prawdy jest IndexedDB. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('k:theme'), m = localStorage.getItem('k:mode'), z = localStorage.getItem('k:tap'), s = localStorage.getItem('k:ts'), g = localStorage.getItem('k:glass'), tl = localStorage.getItem('k:tl');
        var d = document.documentElement;
        if (t) d.setAttribute('data-theme', t);
        if (m) d.setAttribute('data-mode', m);
        if (z) d.setAttribute('data-tap', z);
        if (s) d.style.setProperty('--ts', String(+s / 100));
        if (g) d.style.setProperty('--glass', String(+g / 100));
        if (tl) d.setAttribute('data-tablabels', tl);
      } catch (e) {}
    })();
  </script>
  <style>
    #view.boot-shell {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 30px;
    }
    .boot-shell-inner {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: rgba(247,247,244,.72);
      text-align: center;
    }
    .boot-shell-mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(242,184,75,.24);
      background: rgba(242,184,75,.055);
      color: #f2b84b;
      box-shadow: 0 0 0 9px rgba(242,184,75,.02);
      font-size: 30px;
    }
    .boot-shell-name {
      color: rgba(247,247,244,.92);
      font: 520 1.2rem -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
      letter-spacing: -.03em;
    }
    .boot-shell-note {
      color: rgba(247,247,244,.42);
      font: 500 .68rem -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    }
  </style>
</head>
<body>
  <div id="app">
    <main id="view" class="boot-shell" aria-live="polite">
    <div class="boot-shell-inner">
      <div class="boot-shell-mark" aria-hidden="true">👨‍🍳</div>
      <div class="boot-shell-name">Żarłok</div>
      <div class="boot-shell-note">Przygotowuję Twój notatnik…</div>
    </div>
  </main>
    <nav id="tabbar" aria-label="Główna nawigacja"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlays"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Żarłok wymaga włączonego JavaScriptu.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
