<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240" role="img" aria-labelledby="title-burger desc">
<title id="title-burger">Burger klasyczny — ilustracja SVG Żarłok</title><desc id="desc">Burger z sezamową bułką, serem, sałatą i pomidorem. Styl premium: płaskie kształty z delikatnym światłocieniem, na grafitowym tle.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25272a"/><stop offset="1" stop-color="#111316"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#b8753c" stop-opacity=".18"/><stop offset="1" stop-color="#b8753c" stop-opacity="0"/></radialGradient>
<linearGradient id="plate" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#f2eee4"/><stop offset=".55" stop-color="#d5cec1"/><stop offset="1" stop-color="#aaa293"/></linearGradient>
<linearGradient id="bread" x1="0" y1="0" x2="0.3" y2="1"><stop stop-color="#e8bd78"/><stop offset="1" stop-color="#bd773c"/></linearGradient>
<linearGradient id="bun" x1="0" y1="0" x2="0.2" y2="1"><stop stop-color="#efc77e"/><stop offset="1" stop-color="#b96d32"/></linearGradient>
<linearGradient id="crust" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#f4cf84"/><stop offset="1" stop-color="#bd7739"/></linearGradient>
<linearGradient id="pasta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1d49a"/><stop offset="1" stop-color="#c18a4a"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b9d8d1" stop-opacity=".5"/><stop offset=".5" stop-color="#edf4dc" stop-opacity=".18"/><stop offset="1" stop-color="#7caaa0" stop-opacity=".45"/></linearGradient>
<linearGradient id="salmon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb17e"/><stop offset="1" stop-color="#d65c49"/></linearGradient>
<linearGradient id="steak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a5540"/><stop offset="1" stop-color="#4d2a24"/></linearGradient>
<linearGradient id="dough" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3d79c"/><stop offset="1" stop-color="#c38b4b"/></linearGradient>
