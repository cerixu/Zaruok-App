<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240" role="img" aria-labelledby="title-lasagna desc">
<title id="title-lasagna">Lasagne alla bolognese — ilustracja SVG Żarłok</title><desc id="desc">Warstwowa lasagne z ragù, beszamelem i złotą skórką. Styl premium: płaskie kształty z delikatnym światłocieniem, na grafitowym tle.</desc><defs>
