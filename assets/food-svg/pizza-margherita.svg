<title id="title-pizza-margherita">Pizza Margherita — ilustracja SVG Żarłok</title><desc id="desc">Neapolitańska pizza z pomidorami, mozzarellą i bazylią. Styl premium: płaskie kształty z delikatnym światłocieniem, na grafitowym tle.</desc><defs>
