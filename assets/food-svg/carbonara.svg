<title id="svg-title">Spaghetti Carbonara — ilustracja wektorowa</title>
<desc id="svg-desc">Spaghetti alla carbonara w grafitowej ceramicznej misie, z kremowym sosem jajeczno-pecorino, chrupiącym guanciale, płatkami pecorino romano i świeżo mielonym czarnym pieprzem. Przezroczyste tło.</desc>
