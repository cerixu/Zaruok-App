<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 240 240" role="img" aria-labelledby="carbonara-title carbonara-desc">
<title id="carbonara-title">Spaghetti alla carbonara — Żarłok</title>
<desc id="carbonara-desc">Spaghetti alla carbonara z kremowym sosem jajeczno-pecorino, złocistymi pasmami makaronu, rumianym guanciale, płatkami pecorino romano i świeżo mielonym pieprzem. Grafitowa misa z ciepłym ceramicznym rantem, przezroczyste tło.</desc>
