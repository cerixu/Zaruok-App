<title id="title">Spaghetti alla puttanesca</title>
<desc id="desc">Spaghetti w sosie pomidorowym z oliwkami, kaparami, czosnkiem, anchois i natką pietruszki na grafitowym talerzu. Przezroczyste tło.</desc>
