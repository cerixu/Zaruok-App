  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#b5c77b"/><stop offset=".4" stop-color="#6c8a4d"/><stop offset="1" stop-color="#304a2b"/>
  </linearGradient>
  <linearGradient id="parmesan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff2cf"/><stop offset="1" stop-color="#d5b777"/>
  </linearGradient>
</defs>
