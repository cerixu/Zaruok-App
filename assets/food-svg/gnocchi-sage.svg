  <linearGradient id="gnocchi" x1=".15" y1="0" x2=".8" y2="1">
    <stop stop-color="#ffe5a2"/><stop offset=".34" stop-color="#e9b965"/><stop offset=".7" stop-color="#c8883e"/><stop offset="1" stop-color="#8c4e29"/>
  </linearGradient>
  <linearGradient id="sear" x1="0" y1="0" x2="1" y2="1">
