  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#9a8b75"/><stop offset=".18" stop-color="#363331"/><stop offset=".48" stop-color="#17191b"/><stop offset=".76" stop-color="#5b5042"/><stop offset="1" stop-color="#8a7b65"/>
