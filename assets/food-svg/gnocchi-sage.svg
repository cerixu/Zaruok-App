<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">Gnocchi z masłem szałwiowym</title>
<desc id="desc">Złociste, lekko rumiane gnocchi z emulsją masła, świeżą szałwią i odrobiną parmezanu na ciemnym ceramicznym talerzu. Przezroczyste tło.</desc>
