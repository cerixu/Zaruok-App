<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240" role="img" aria-labelledby="title-bruschetta desc">
<title id="title-bruschetta">Bruschetta al pomodoro — ilustracja SVG Żarłok</title><desc id="desc">Trzy chrupiące grzanki z pomidorami i bazylią. Styl premium: płaskie kształty z delikatnym światłocieniem, na grafitowym tle.</desc><defs>
