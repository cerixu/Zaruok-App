<title id="title-panna-cotta">Panna cotta — ilustracja SVG Żarłok</title><desc id="desc">Jedwabista panna cotta z malinowym coulis. Styl premium: płaskie kształty z delikatnym światłocieniem, na grafitowym tle.</desc><defs>
