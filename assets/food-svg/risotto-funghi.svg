 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9a98e"/><stop offset=".17" stop-color="#45413b"/><stop offset=".42" stop-color="#17191b"/><stop offset=".68" stop-color="#6d5d49"/><stop offset="1" stop-color="#222426"/></linearGradient>
 <linearGradient id="rice" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#fff0c7"/><stop offset=".36" stop-color="#e7d3a4"/><stop offset=".7" stop-color="#c7a66f"/><stop offset="1" stop-color="#f3dfb1"/></linearGradient>
