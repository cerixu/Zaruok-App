<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">Risotto ai funghi</title>
<desc id="desc">Kremowe risotto z rumianymi grzybami, natką pietruszki i płatkami Parmigiano Reggiano na ciemnym ceramicznym talerzu. Przezroczyste tło.</desc>
