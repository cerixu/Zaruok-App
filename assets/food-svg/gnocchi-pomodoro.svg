    </linearGradient>
    <linearGradient id="bowl" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#46332a"/><stop offset=".42" stop-color="#201714"/><stop offset=".76" stop-color="#0c0c0c"/><stop offset="1" stop-color="#38271f"/>
    </linearGradient>
    <linearGradient id="sauce" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#ef7940"/><stop offset=".42" stop-color="#c83b20"/><stop offset=".78" stop-color="#a82419"/><stop offset="1" stop-color="#e65a2c"/>
    </linearGradient>
    <linearGradient id="gnocchi" x1="0" y1="0" x2=".25" y2="1">
      <stop stop-color="#fff0bd"/><stop offset=".38" stop-color="#f3d17f"/><stop offset=".78" stop-color="#d99a43"/><stop offset="1" stop-color="#b96f2d"/>
    </linearGradient>
