      <path d="M-7-5.1C-3.5-7.1 4.1-7.1 7-4.7" fill="none" stroke="#fff3c9" stroke-width="1.4" stroke-linecap="round" opacity=".9"/>
      <path d="M-7.2-1.7C-5.2 0-4.8 2.1-5.1 3.8M-1.5-2.8C.6-.1.8 2.1.1 4.8M4-2.5C5.5-.1 5.2 1.7 4.3 3.1" fill="none" stroke="#a96831" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
    </g>
    <g id="basil-leaf">
