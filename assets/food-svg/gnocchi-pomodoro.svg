<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Gnocchi al pomodoro</title>
  <desc id="desc">Złociste gnocchi w sosie pomidorowym, z bazylią i drobno startym serem, podane w ciemnej ceramicznej misie. Ilustracja wektorowa na przezroczystym tle.</desc>
  <defs>
