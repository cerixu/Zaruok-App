<title id="title-tiramisu">Tiramisù classico — Żarłok</title>
<desc id="desc-tiramisu">Porcja tiramisù z warstwami kawowego biszkoptu i kremu mascarpone, falistym kremowym wierzchem oraz oprószeniem kakao, na grafitowym talerzu z ciepłym rantem. Przezroczyste tło.</desc>
