<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
<title id="title">Carbonara — hybrydowa ilustracja SVG</title>
<desc id="desc">Spaghetti alla carbonara z guanciale, pecorino, czarnym pieprzem i bazylią. Przezroczyste tło, ciepłe detale i grafitowa misa.</desc>
<defs>
