</g>
<!-- pepper is sparse and fine -->
<g fill="#252019"><circle cx="174" cy="204" r="2.5"/><circle cx="200" cy="161" r="2.2"/><circle cx="241" cy="174" r="2.1"/><circle cx="284" cy="192" r="2.4"/><circle cx="310" cy="178" r="2.1"/><circle cx="344" cy="203" r="2.5"/><circle cx="290" cy="248" r="2.2"/><circle cx="220" cy="242" r="2.1"/><circle cx="154" cy="231" r="1.8"/></g>
</g>
