<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">Spaghetti alla carbonara</title>
<desc id="desc">Gniazdo spaghetti w kremowym sosie jajeczno-serowym, z rumianym guanciale, pecorino i świeżo mielonym pieprzem, podane w ciemnej ceramicznej misce. Przezroczyste tło.</desc>
<defs>
 <linearGradient id="bowl" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#45484a"/><stop offset=".18" stop-color="#1b2022"/><stop offset=".7" stop-color="#080a0b"/><stop offset="1" stop-color="#343638"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a29d8c"/><stop offset=".2" stop-color="#34383a"/><stop offset=".8" stop-color="#111416"/><stop offset="1" stop-color="#77756d"/></linearGradient>
 <linearGradient id="noodle" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#fff4b5"/><stop offset=".23" stop-color="#f9d96d"/><stop offset=".58" stop-color="#eab13d"/><stop offset=".82" stop-color="#c78325"/><stop offset="1" stop-color="#ffe18a"/></linearGradient>
 <linearGradient id="noodleLight" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff9d8"/><stop offset=".45" stop-color="#ffe58c"/><stop offset="1" stop-color="#d8952d"/></linearGradient>
 <linearGradient id="guanciale" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd69a"/><stop offset=".18" stop-color="#e99a56"/><stop offset=".42" stop-color="#8c3822"/><stop offset=".62" stop-color="#f0a35f"/><stop offset=".83" stop-color="#b94e2b"/><stop offset="1" stop-color="#672719"/></linearGradient>
 <linearGradient id="fat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0c6"/><stop offset="1" stop-color="#dba96b"/></linearGradient>
 <radialGradient id="sauce"><stop stop-color="#ffe9a0"/><stop offset=".78" stop-color="#e9b64c"/><stop offset="1" stop-color="#b8792a"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
 <clipPath id="plate"><ellipse cx="256" cy="207" rx="184" ry="82"/></clipPath>
</defs>
<ellipse cx="256" cy="390" rx="150" ry="17" fill="#000" opacity=".25" filter="url(#soft)"/>
