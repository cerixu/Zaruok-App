<path d="M77 251 C111 314 167 342 256 344 C345 342 401 314 435 251" fill="none" stroke="#73736c" stroke-width="2" opacity=".42"/>
<ellipse cx="256" cy="207" rx="211" ry="104" fill="url(#rim)" stroke="#999487" stroke-width="2.5"/>
<ellipse cx="256" cy="205" rx="194" ry="89" fill="#17191a" stroke="#090b0c" stroke-width="4"/>
<ellipse cx="256" cy="207" rx="184" ry="82" fill="url(#sauce)"/>
<g clip-path="url(#plate)">
