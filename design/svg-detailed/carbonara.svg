 <path d="M138 228 C165 253 195 263 218 247 C239 231 235 213 221 210 C205 205 194 222 208 234 C227 250 259 259 286 245 C308 234 320 216 312 202" stroke="url(#noodleLight)" stroke-width="10"/>
