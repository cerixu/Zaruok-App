<path d="M62 203 C75 152 132 116 201 111" fill="none" stroke="#f2ead6" stroke-width="3" opacity=".3" stroke-linecap="round"/>
<path d="M92 288 C129 324 186 340 256 341" fill="none" stroke="#d6cbb3" stroke-width="2" opacity=".16" stroke-linecap="round"/>
</svg>