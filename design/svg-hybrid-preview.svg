<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Żarłok — hybryda premium i flat, zestaw wzorcowy</title>
<desc id="desc">Sześć oryginalnych ilustracji SVG na przezroczystym tle: carbonara, pizza margherita, krem pomidorowy, burger, sałatka grecka i mojito. Średni poziom detali.</desc>
<defs>
  <linearGradient id="ceramic" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#f7f0df"/><stop offset=".48" stop-color="#c8c5b8"/><stop offset="1" stop-color="#8b918d"/></linearGradient>
  <linearGradient id="bowl" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#3d4649"/><stop offset=".55" stop-color="#171f23"/><stop offset="1" stop-color="#0b1013"/></linearGradient>
  <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7950"/><stop offset="1" stop-color="#c93225"/></linearGradient>
  <linearGradient id="crust" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#ffd27a"/><stop offset="1" stop-color="#d77a2f"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9acb55"/><stop offset="1" stop-color="#347b3e"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdc91"/><stop offset="1" stop-color="#e98b2a"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  <g id="leaf"><path d="M0 0 C-16 -17 -12 -34 3 -39 C14 -22 12 -8 0 0Z" fill="url(#green)" stroke="#275b32" stroke-width="1.4"/><path d="M0 -2 L2 -29" fill="none" stroke="#c3df7d" stroke-width="1.4"/></g>
  <g id="tomato-dot"><circle r="11" fill="url(#tomato)"/><path d="M0 -10 l-2 -5 5 3 5 -2 -2 5" fill="#477b38"/><circle cx="-3" cy="-4" r="2" fill="#ffb18b" opacity=".8"/></g>
  <g id="cheese"><path d="M-13 -9 Q0 -17 13 -7 L10 8 Q0 15 -12 7Z" fill="#f4e5b5" stroke="#d7bd7e" stroke-width="1.2"/><circle cx="-4" cy="-2" r="2" fill="#d7bd7e"/><circle cx="5" cy="4" r="1.7" fill="#d7bd7e"/></g>
</defs>
<!-- carbonara -->
<g transform="translate(160 145)">
