<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Żarłok — podgląd SVG premium</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0b0d0f;color:#f3f1ec;font:15px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
main{max-width:620px;margin:auto}
h1{font-size:24px;margin:0 0 6px}
p{color:#aeb4b7;margin:0 0 18px}
.panel{border:1px solid #303438;border-radius:20px;padding:16px;background:linear-gradient(145deg,#171a1d,#0e1012);margin:14px 0}
.dark{background:#101214}
.light{background:#f0eadf;color:#222}
img{display:block;width:100%;height:auto;max-width:460px;margin:auto}
small{display:block;text-align:center;opacity:.7;margin-top:8px}
</style></head>
<body><main>
<h1>Carbonara — styl SVG premium</h1>
<p>Pojedynczy wzorzec. Ciemna ceramika, szczegółowe spaghetti i przezroczyste tło SVG.</p>
<section class="panel dark"><img src="svg-detailed/carbonara.svg" alt="Carbonara na ciemnym tle"><small>Test na ciemnym tle</small></section>
<section class="panel light"><img src="svg-detailed/carbonara.svg" alt="Carbonara na jasnym tle"><small>Test kontrastu na jasnym tle</small></section>
</main></body></html>
