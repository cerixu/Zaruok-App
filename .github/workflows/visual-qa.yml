name: Visual QA

on:
  push:
    branches: [main, qa-visual-icons]
  pull_request:
    branches: [main]

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 >/tmp/zaruok-http.log 2>&1 &
      - name: Run mobile visual smoke QA
        run: node qa/visual-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaruok-visual-qa
          path: qa-shots/
          if-no-files-found: ignore
