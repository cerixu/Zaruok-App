name: Deploy static PWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JavaScript
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const names = (await fs.readdir('.')).filter((n) => n.endsWith('.js'));
          const missing = [];
          for (const name of names) {
            const source = await fs.readFile(name, 'utf8');
            for (const match of source.matchAll(/(?:from|import)\s*['"]\.(\/[^'"]+)['"]/g)) {
              const target = match[1].replace(/^\//, '');
              try { await fs.access(new URL(target, import.meta.url)); }
              catch { missing.push(`${name} -> ${target}`); }
            }
          }
          if (missing.length) {
            console.error('Missing local JS imports:', missing.join(', '));
            process.exit(1);
          }
          NODE

      - name: Validate module exports
        shell: bash
        run: |
          set -e
          node --input-type=module <<'NODE'
          const fs = await import('node:fs/promises');
          const files = (await fs.readdir('.')).filter((n) => n.endsWith('.js'));
          const sourceByFile = new Map();
          const exportsByFile = new Map();

          for (const file of files) {
            const source = await fs.readFile(file, 'utf8');
            sourceByFile.set(file, source);
            const ex = new Set();

            for (const m of source.matchAll(/\bexport\s+(?:async\s+)?function\s+([A-Za-z_$][\\w$]*)/g)) ex.add(m[1]);
            for (const m of source.matchAll(/\bexport\s+(?:const|let|var|class)\s+([A-Za-z_$][\\w$]*)/g)) ex.add(m[1]);
            for (const m of source.matchAll(/\bexport\s*\{([\\s\\S]*?)\}/g)) {
              for (const part of m[1].split(',')) {
                const cleaned = part.replace(/\/\/.*$/gm, '').trim();
                if (!cleaned) continue;
                const match = cleaned.match(/^([A-Za-z_$][\\w$]*)(?:\\s+as\\s+([A-Za-z_$][\\w$]*))?$/);
                if (match) ex.add(match[2] || match[1]);
              }
            }
            exportsByFile.set(file, ex);
          }

          const errors = [];
          for (const [file, source] of sourceByFile) {
            for (const m of source.matchAll(/import\s*\{([\\s\\S]*?)\}\s*from\s*['"](.+?)['"]/g)) {
              const spec = m[1];
              const targetPath = m[2];
              if (!targetPath.startsWith('./') || !targetPath.endsWith('.js')) continue;
              const target = targetPath.slice(2);
              const ex = exportsByFile.get(target);
              if (!ex) {
                errors.push(`${file} -> missing module ${target}`);
                continue;
              }
              for (const part of spec.split(',')) {
                const cleaned = part.replace(/\/\/.*$/gm, '').trim();
                if (!cleaned) continue;
                const imported = cleaned.match(/^([A-Za-z_$][\\w$]*)(?:\\s+as\\s+[A-Za-z_$][\\w$]*)?$/)?.[1];
                if (imported && !ex.has(imported)) errors.push(`${file} -> ${imported} is not exported by ${target}`);
              }
            }
          }

          if (errors.length) {
            console.error('Broken named imports:');
            console.error(errors.join('\\n'));
            process.exit(1);
          }
          console.log('All local named imports match their exports.');
          NODE

      - name: WebKit startup smoke test
        shell: bash
        run: |
          set -e
          rm -rf ci-webkit playwright.config.mjs
          mkdir -p ci-webkit

          cat > playwright.config.mjs <<'EOF'
          export default {
            testDir: './ci-webkit',
            testMatch: '**/boot.spec.js',
            timeout: 35000,
            projects: [{ name: 'webkit', use: { browserName: 'webkit' } }],
          };
          EOF

          cat > ci-webkit/boot.spec.js <<'EOF'
          import { test, expect } from '@playwright/test';

          test('Żarłok uruchamia się w WebKit bez błędu JS', async ({ page }) => {
            const errors = [];
            await page.addInitScript(() => {
              window.__bootErrors = [];
              window.addEventListener('error', (e) => window.__bootErrors.push({ message: e.message, filename: e.filename, line: e.lineno, col: e.colno, stack: e.error && e.error.stack }));
              window.addEventListener('unhandledrejection', (e) => window.__bootErrors.push({ message: String(e.reason), stack: e.reason && e.reason.stack }));
            });
            page.on('pageerror', (e) => errors.push(String(e && (e.stack || e.message || e))));
            page.on('console', (m) => { if (m.type() === 'error') errors.push(m.text()); });

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'commit', timeout: 5000 });
            await page.waitForTimeout(2500);

            console.log('WEBKIT BODY:\n' + await page.locator('body').innerText());
            console.log('WEBKIT PAGE ERRORS:\n' + JSON.stringify(errors, null, 2));
            // Do not fetch modules from page.evaluate here: WebKit's CORS restrictions
            // make the diagnostic probe report false console errors and block deployment.

            await expect(page.getByText('Żarłok nie wystartował')).toHaveCount(0);
            await expect(page.getByText('Przygotowuję Twój notatnik…')).toHaveCount(0);

            if (errors.length) throw new Error('Browser errors:\\n' + errors.join('\\n'));
            await expect(page.locator('#view')).toBeVisible();

            // Test the real iPhone-sensitive path: input must not be rebuilt for each digit.
            await page.goto('http://127.0.0.1:4173/index.html#/calc/pizza', { waitUntil: 'domcontentloaded', timeout: 5000 });
            await expect(page.getByRole('button', { name: 'Mam mąkę' })).toBeVisible({ timeout: 10000 });
            const temp = page.getByRole('textbox', { name: 'Temperatura fermentacji' });
            await temp.click();
            await page.waitForTimeout(20);
            await temp.press('Control+A');
            await page.keyboard.type('25');
            await expect(temp).toHaveValue('25');
            await expect(temp).toBeFocused();

            await page.getByRole('textbox', { name: 'Masa mąki' }).fill('1000');
            await page.getByLabel('Rodzaj zaczynu').selectOption('starter');
            await expect(page.getByText('10 g + 10 g + 20 g = 40 g')).toBeVisible();
            const starterPct = page.getByRole('textbox', { name: 'Aktywny zakwas procent mąki' });
            await starterPct.fill('40');
            await expect(page.locator('.result').filter({ hasText: 'Zakwas macierzysty' })).toContainText('100');
            await expect(page.locator('.result').filter({ hasText: 'Mąka do zakwasu' })).toContainText('100');
            await expect(page.locator('.result').filter({ hasText: 'Woda do zakwasu' })).toContainText('200');
            await expect(page.getByText('Aktywny zakwas łącznie')).toBeVisible();
            await expect(page.locator('.result').filter({ hasText: 'Masa całkowita' })).toContainText('1780');

            await page.getByRole('button', { name: 'Zapisz jako recepturę' }).click();
            const openRecipe = page.getByRole('button', { name: 'Otwórz' });
            await expect(openRecipe).toBeVisible({ timeout: 5000 });
            await openRecipe.click();
            await expect(page.getByText('Zakwas macierzysty', { exact: true })).toBeVisible({ timeout: 5000 });
            await expect(page.getByText('Mąka pszenna do zakwasu', { exact: true })).toBeVisible();
            await expect(page.getByText('Woda do zakwasu', { exact: true })).toBeVisible();
          });
          EOF

          python3 -m http.server 4173 --directory . >/tmp/zaruok-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -rf ci-webkit playwright.config.mjs' EXIT

          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps webkit
          npx playwright test --config=playwright.config.mjs --reporter=line

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
