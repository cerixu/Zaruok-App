name: Import original Carbonara SVG

on:
  push:
    branches:
      - design/carbonara-dark-premium
    paths:
      - .github/workflows/import-carbonara-svg.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-carbonara-svg.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  import-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/carbonara-dark-premium
          fetch-depth: 0
      - name: Download the original vector asset
        run: |
          curl --fail --location --retry 3 --output /tmp/carbonara.svg 'https://at.adobe.com/DAwIzXydZvz94D88'
          test -s /tmp/carbonara.svg
          grep -q '<svg' /tmp/carbonara.svg
          mkdir -p design/svg-detailed
          cp /tmp/carbonara.svg design/svg-detailed/carbonara-original.svg
          test "$(grep -o '<path' design/svg-detailed/carbonara-original.svg | wc -l)" -gt 100
      - name: Commit original SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/svg-detailed/carbonara-original.svg
          git commit -m "Add original vectorized Carbonara SVG" || exit 0
          git push origin HEAD:design/carbonara-dark-premium
